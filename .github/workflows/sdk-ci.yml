name: SDK CI

# Runs the JavaScript, Python, PHP, Java and Go client SDK suites. Path-filtered to SDK sources AND
# the server contract surfaces the SDK types mirror (DTOs, controllers, services + the engine
# interface), so a backend DTO change also re-runs the SDK suites and surfaces contract drift. The
# JavaScript job also builds and runs the dual-format packaging smoke test (require() + import() both
# consumable) plus real requests through each build's client.
on:
  push:
    branches: [main]
    paths:
      [
        'sdk/**',
        '.github/workflows/sdk-ci.yml',
        'src/**/dto/**',
        'src/**/*.controller.ts',
        'src/**/*.service.ts',
        'src/engine/interfaces/whatsapp-engine.interface.ts',
      ]
  pull_request:
    branches: [main]
    paths:
      [
        'sdk/**',
        '.github/workflows/sdk-ci.yml',
        'src/**/dto/**',
        'src/**/*.controller.ts',
        'src/**/*.service.ts',
        'src/engine/interfaces/whatsapp-engine.interface.ts',
      ]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript SDK (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 18 is the published package's engines floor; vitest 5 needs Node 22.12+, so 18 and 20 only
        # gate the typecheck, build and smoke (packaging plus real requests through each build's
        # client), and the unit tests run on 22.
        node: ['18', '20', '22']
    defaults:
      run:
        working-directory: sdk/javascript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: sdk/javascript/package-lock.json
      # The lane that runs the tests installs with --engine-strict, so a locked toolchain that drops
      # its Node fails here, naming the package, instead of warning and then testing on an
      # unsupported runtime or failing at startup on a skipped native binding. The condition is the
      # test step's own.
      - run: npm ci --engine-strict=${{ matrix.node == '22' }}
      - run: npm test
        if: matrix.node == '22'
      # The build tsconfigs exclude test/, and vitest strips types without checking them, so the
      # type-level wire contract in test/*.test-d.ts only gates if tsc runs over test/ too (#754).
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke # packaging plus request smoke; must run after build

  python:
    name: Python SDK (${{ matrix.python }})
    # setup-python has no Python 3.9 build for Ubuntu 26.04, which ubuntu-latest now resolves to.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      # Before pytest: this package ships py.typed, so its annotations are a published contract,
      # and pytest cannot see a mistake in them — TypedDict keys are not enforced at runtime, so a
      # request type missing a field passes every test here while a typed caller is told the field
      # does not exist.
      - run: mypy
      - run: pytest

  php:
    name: PHP SDK (${{ matrix.php }}, Guzzle ${{ matrix.guzzle }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
        guzzle: ['7', '8']
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer install --no-interaction --no-progress
      - run: composer update 'guzzlehttp/guzzle:^7.9' --with-all-dependencies --no-interaction --no-progress
        if: matrix.guzzle == '7'
      - run: ./vendor/bin/phpunit

  java:
    name: Java SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.22' # the go.mod minimum, so CI gates what the SDK claims to support
          cache: false # stdlib-only, no go.sum to cache
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo 'Unformatted files:'
            gofmt -l .
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
