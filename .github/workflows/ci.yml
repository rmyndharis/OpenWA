name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # `nest build` uses tsconfig.build.json which excludes **/*spec.ts, and ts-jest/eslint don't
      # full-program type-check specs — so without this gate, type errors in spec files are invisible
      # to CI. tsconfig.json already includes both `src` and `test`, so this is the cheapest full-program
      # check covering specs (no separate tsconfig.spec.json needed).
      - name: Type-check full program (including specs)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Check formatting
        run: npm run format:check

      - name: Check version consistency (docs track package.json)
        run: npm run check:versions

      # The builder stage ends with `COPY . .` — fail if .dockerignore stops rejecting non-build
      # material (or starts rejecting a build input) before a Docker build finds out.
      - name: Check Docker build context (.dockerignore)
        run: npm run check:dockerignore

      # The committed openapi.json is the machine-readable API contract. Fail if a controller/DTO
      # change landed without regenerating the snapshot (npm run openapi:export). The generator
      # bootstraps the app hermetically (in-memory/temp SQLite, no listen), so this is a static check.
      - name: Check OpenAPI snapshot is up to date
        run: npm run openapi:check

      # Lives here, not in sdk-ci.yml: that workflow is path-filtered and does not list openapi.json,
      # so a contract change alone runs none of it — and it never runs on a release tag at all.
      - name: Check SDK routes against the contract
        run: npm run check:sdk-routes

      # The other direction. check:sdk-routes verifies every route an SDK builds exists in the
      # contract; nothing verified that every route the contract publishes has a client method, and
      # ten reached main without one. Fails PER SDK so a route three clients have and two do not is
      # a failure rather than a healthy-looking total.
      - name: Check the contract is covered by every SDK
        run: npm run check:sdk-coverage

      - name: Check SDK webhook events against the contract
        run: npm run check:sdk-events

      # Same reason again: a docs-only PR matches none of sdk-ci.yml's path filter, and the drift this
      # catches is a documentation one — fourteen feature commits shipped a client method that the
      # design doc never learned about.
      - name: Check SDK docs cover the shipped client surface
        run: npm run check:sdk-docs

      # The shape half of the client contract gates above: routes/events/methods say WHICH
      # endpoints exist, this says the hand-written SDK/dashboard types mirror the DTO schemas
      # they carry — the verification none of the other gates provide.
      - name: Client wire-shape contract check
        run: npm run check:contract-shapes

  # Deliberately its own job rather than a step inside Lint. `npm audit` reports against the
  # advisory database, not against the diff, so a newly published advisory turns red on unrelated
  # PRs. While it lived as the first step of Lint, that failure aborted the job before ESLint, the
  # type-check, the format check, the version check and the OpenAPI drift gate ever ran — a
  # dependency advisory silently switched off every code-quality gate. Split out, an advisory is
  # still blocking (`build` needs it) but can no longer mask an unrelated result.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          # Both trees are installed below, so both lockfiles belong in the cache key.
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        # Same high (not critical) threshold, applied per advisory rather than all-or-nothing: an
        # advisory with no patched version can be excused BY ID in scripts/check-audit.mjs, with its
        # reason recorded, instead of lowering the bar for everything. The script also fails on an
        # allowlist entry whose advisory has gone, so a carve-out cannot outlive its cause.
        run: npm run check:audit

      # The dashboard is a SECOND dependency tree, and it is the one that reaches a browser: its
      # runtime deps are bundled into dashboard/dist, which the production image copies and serves.
      # It went unscanned by every job in both the PR and the tag path — the image scan sees OS
      # packages and the bundled output, not the npm graph behind it — so a HIGH advisory in a
      # runtime dep could ride a release undetected. Audited here rather than as a step in the
      # `dashboard` job for the same reason this job exists at all: an advisory must not abort that
      # job's lint, typecheck, i18n, build and unit tests before they run.
      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Security audit (dashboard)
        run: cd dashboard && npm audit --audit-level=high

  test:
    name: Test
    runs-on: ubuntu-latest
    # Real Redis for the queue-on e2e suite (test/queue-on.e2e-spec.ts); the rest of the e2e family
    # boots QUEUE_ENABLED=false and never connects. Mirrors the test-postgres job's service pattern;
    # the image pin matches docker-compose.yml.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --coverage

      # Repo-file drift gates (docs, manifests, compose, workflows vs the code they describe). They
      # read files and assert content — no runtime behavior — so they run as their own jest selection
      # (`test:docs`) instead of padding the unit lane; `testPathIgnorePatterns` in package.json keeps
      # the default run to behavioral suites only. The two lists must stay in sync.
      # `--testPathIgnorePatterns` must stay AFTER the positional paths in `test:docs` — jest array
      # options greedily consume trailing positionals.
      - name: Run doc-lint tests
        run: npm run test:docs

      # node:test specs for the repo-level scripts (postinstall exit-code propagation) — jest's
      # rootDir is src/, so these live outside its reach and run on the plain node runner.
      - name: Run script unit tests
        run: npm run test:scripts

      - name: Run e2e smoke tests
        run: npm run test:e2e
        # Point the queue-on suite at the service container (it self-skips without one). Every other
        # suite keeps QUEUE_ENABLED=false via setup-e2e.ts and never touches Redis.
        env:
          REDIS_HOST: localhost
          REDIS_PORT: '6379'

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  test-postgres:
    name: Test (PostgreSQL migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openwa
          POSTGRES_PASSWORD: openwa
          POSTGRES_DB: openwa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openwa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (compiles the data migrations to dist/)
        run: npm run build

      # Applies the full data-migration chain to a real Postgres and asserts every generated-uuid PK
      # has a DB DEFAULT — the dialect gap SQLite-only tests can't see.
      - name: Migrate + uuid-default smoke against PostgreSQL
        run: npm run test:pg-smoke
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_USERNAME: openwa
          DATABASE_PASSWORD: openwa
          DATABASE_NAME: openwa

      # Runtime-proves BuiltInFtsProvider on Postgres (websearch_to_tsquery + ts_headline against the
      # STORED body_ts tsvector), the boot-migration advisory lock (two concurrent migrators on one
      # database), that a paged message list has a total order (Postgres sorts a tie group
      # differently between two statements, so an unstable order drops rows from a page walk), and
      # that the data entities can build their own schema (raw SQL the ORM passes through verbatim,
      # such as a partial index predicate, only case-folds on a real server). All four self-skip
      # unless DATABASE_TYPE=postgres, so they are a no-op in the default test job and only execute
      # here against the postgres:16 service.
      - name: Postgres specs (FTS provider + boot-migration lock + list ordering + entity synchronize)
        # --runInBand: the specs issue DDL against the one shared service database, and jest's
        # default file-parallelism races their catalog writes (pg_type duplicate-key). The lock
        # spec's own two-migrator race is in-file (Promise.all) and unaffected by runInBand. The
        # synchronize spec additionally CREATEs and DROPs a scratch database of its own, which is
        # only safe serialized.
        run: npx jest --runInBand src/database/migrations/__tests__/1782400000000-AddMessagesFts.pg.spec.ts src/database/migrations/__tests__/pg-boot-migrations.pg.spec.ts src/modules/message/message-list-ordering.pg.spec.ts src/database/migrations/__tests__/pg-entity-synchronize.pg.spec.ts
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_USERNAME: openwa
          DATABASE_PASSWORD: openwa
          DATABASE_NAME: openwa

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: cd dashboard && npm ci

      - name: Run ESLint
        run: cd dashboard && npm run lint

      # ESLint here carries no Prettier plugin, and the root `format:check` globs `src/**/*.ts` from
      # the repository root — it never reaches `dashboard/`. Without this step nothing in CI checks
      # dashboard formatting, which is how 35 files drifted before this gate existed.
      - name: Check formatting
        run: cd dashboard && npm run format:check

      - name: Type-check dashboard tests
        run: cd dashboard && npm run typecheck

      - name: Check i18n parity
        run: cd dashboard && npm run i18n:check

      - name: Build dashboard
        run: cd dashboard && npm run build

      - name: Run dashboard unit tests
        run: cd dashboard && npm run test:unit

  # The repo ships several host-level shell smoke scripts (scripts/smoke-test-*.sh, plus
  # scripts/backup.sh / scripts/restore.sh exercised by smoke-test-backup-restore.sh). None of them
  # are exercised by the jest suites, so without this gate a regression in the bash hardening lands
  # silently. The job is cheap (no npm install, no build) and parallel to the others.
  scripts-smoke:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install sqlite3
        # smoke-test-backup-restore.sh skips its sqlite3 .backup roundtrip case (with a notice) when
        # the host lacks the CLI; installing it here exercises that path on every run instead.
        # Bounded, and skipped when the runner image already ships the CLI. An unbounded apt-get
        # against a slow mirror held this job open for over an hour with every other job already
        # green, so the run never reported and main went without a signal.
        timeout-minutes: 5
        run: command -v sqlite3 >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3; }

      - name: Install shellcheck
        # Runs its own update rather than inheriting one from the step above, which no longer
        # always runs.
        timeout-minutes: 5
        run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck; }

      - name: shellcheck every shell script
        # Widened from the original three (#926) now that the rest are clean too. The narrow scope was
        # not free: `smoke-test-non-root.sh` carried a UTF-8 BOM before its shebang for months, which
        # shellcheck reports as SC1082 and which nothing else here would ever have caught.
        # `docker-entrypoint.sh` is named explicitly because it is the only shell script outside
        # scripts/, and a `scripts/*.sh` glob silently excluded the one that runs as root, chowns the
        # data volume and execs gosu — the most privilege-sensitive script in the repo.
        run: shellcheck docker-entrypoint.sh scripts/*.sh

      - name: Run backup/restore smoke test
        run: ./scripts/smoke-test-backup-restore.sh

  # The chart and the workflows had no gate of any kind: nothing rendered charts/openwa, and nothing
  # parsed the workflow YAML. Tools run as pinned containers rather than actions so there is no new
  # action to pin by SHA, matching how redis/postgres images are pinned elsewhere in this file.
  chart:
    name: Helm chart and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # For the behaviour check below. No `npm ci`: it imports only node: builtins, so pinning the
      # runtime is the whole dependency — without this the step would silently take whatever Node the
      # runner image happens to ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: helm lint
        run: docker run --rm -v "$PWD/charts:/charts:ro" alpine/helm:4.2.3 lint /charts/openwa

      # Two value sets: the defaults an operator gets, and every optional resource switched on, so a
      # template that only breaks under a toggle cannot pass unnoticed.
      - name: helm template
        run: |
          mkdir -p rendered
          docker run --rm -v "$PWD/charts:/charts:ro" alpine/helm:4.2.3 \
            template ci /charts/openwa > rendered/default.yaml
          docker run --rm -v "$PWD/charts:/charts:ro" alpine/helm:4.2.3 \
            template ci /charts/openwa \
            --set ingress.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set serviceMonitor.enabled=true > rendered/toggled.yaml

      # -ignore-missing-schemas so the ServiceMonitor CRD is skipped rather than failing the run;
      # without it the toggled render exits 1 on a resource whose schema is not in the catalogue.
      - name: Validate rendered manifests
        run: |
          docker run --rm -v "$PWD/rendered:/w:ro" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -ignore-missing-schemas -summary /w/default.yaml /w/toggled.yaml

      # The three steps above all ask whether the chart renders into schema-valid YAML. This one asks
      # what the rendered objects would do in a cluster — a selector matching two Services, a probe
      # budget boot cannot meet, a config change that reaches no container. It shells out to the same
      # pinned helm image, so it needs no chart tooling of its own.
      - name: Check chart behaviour
        run: npm run check:chart

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, audit, test, dashboard, scripts-smoke, chart]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, test-postgres]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Branch + SHA tags only. `latest` is deliberately NOT set here: re-pointing it on
          # every main push would bypass the boot-smoke → promote discipline in release.yml
          # (a main-push image is build-gated only, never boot-tested). `latest` moves exclusively
          # through the tested release path.
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and optionally push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          # Fork pull requests receive a read-only token, so they validate both image architectures
          # without publishing. Trusted branch pushes retain the existing GHCR publication behavior.
          push: ${{ github.event_name == 'push' }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance is generated by default (build-push-action v7); pin it explicitly and opt into
          # an SBOM attestation so each published image carries an in-toto SLSA provenance + SBOM pair,
          # verifiable via `docker buildx imagetools inspect`.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Never serve the production stage's apt layer from cache on branch builds either: a
          # cached hit installs whatever the apt index held when the layer was first built, so a
          # `:main` image can ship OS packages Debian has since patched. release.yml's docker
          # build carries the same line plus the incident record that motivated it.
          no-cache-filters: production

      # The image carries no USER directive by design: docker-entrypoint.sh starts as root to fix
      # named-volume ownership, then drops with `exec gosu openwa`. Nothing verified that drop —
      # smoke-test-non-root.sh existed but no job ran it, so a change leaving Node on uid 0 passed
      # every gate above and reached `latest`. Loaded single-arch from the same gha cache the
      # multi-arch build just populated, so this reuses those layers rather than building twice.
      - name: Load a single-arch image for the runtime smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: openwa-ci:non-root-smoke
          cache-from: type=gha

      - name: Verify the image drops from root to the openwa user
        env:
          OPENWA_SMOKE_IMAGE: openwa-ci:non-root-smoke
        run: ./scripts/smoke-test-non-root.sh
