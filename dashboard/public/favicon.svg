<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="48" height="48">
  <defs>
    <linearGradient id="xenai-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Infinity symbol using two overlapping circles -->
  <path d="M30,30 m-18,0 a18,18 0 1,0 36,0 a18,18 0 1,0 -36,0" fill="none" stroke="url(#xenai-grad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M70,30 m-18,0 a18,18 0 1,0 36,0 a18,18 0 1,0 -36,0" fill="none" stroke="url(#xenai-grad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Cross-over bridge -->
  <path d="M42,30 Q50,10 58,30" fill="none" stroke="url(#xenai-grad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M42,30 Q50,50 58,30" fill="none" stroke="url(#xenai-grad)" stroke-width="8" stroke-linecap="round"/>
</svg>
