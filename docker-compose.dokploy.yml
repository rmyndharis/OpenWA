services:
  openwa:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "2785"
    ports:
      - "2785:2785"
    command: >
      sh -c 'npx @open-wa/wa-automate@4.76.0
      --port 2785
      --api-key "$$API_MASTER_KEY"
      --webhook "https://citaapp.es/webhooks/openwa"
      --session-id fisiodemo
      --use-chrome
      --headless'
    environment:
      NODE_ENV: production
      PORT: 2785
      LOG_LEVEL: info
      API_MASTER_KEY: ${API_MASTER_KEY}
      ENABLE_SWAGGER: "true"
    volumes:
      - openwa-data:/app/data
    shm_size: "1gb"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - openwa

volumes:
  openwa-data:
